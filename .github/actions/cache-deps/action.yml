name: "Cache Dependencies"
description: "Restore and save cache for yarn and Next.js dependencies"

inputs:
  operation:
    description: "Operation to perform (restore or save)"
    required: true
    type: string
  job-type:
    description: "Type of job (build, test, or lint)"
    required: true
    type: string

outputs:
  cache-hit:
    description: "Whether there was a cache hit"
    value: ${{ steps.yarn-cache.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Restore yarn dependencies
      if: inputs.operation == 'restore'
      id: yarn-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          node_modules
        key: ${{ runner.os }}-yarn-deps-${{ inputs.job-type }}-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-deps-${{ inputs.job-type }}-

    - name: Restore nextjs cache
      if: inputs.operation == 'restore' && inputs.job-type == 'build'
      id: nextjs-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          .next/cache
        key: ${{ runner.os }}-nextjs-build-cache-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-build-cache-${{ hashFiles('**/yarn.lock') }}-

    - name: Save yarn cache
      if: inputs.operation == 'save' && steps.yarn-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          node_modules
        key: ${{ runner.os }}-yarn-deps-${{ inputs.job-type }}-${{ hashFiles('**/yarn.lock') }}

    - name: Save nextjs cache
      if: inputs.operation == 'save' && inputs.job-type == 'build' && steps.nextjs-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          .next/cache
        key: ${{ runner.os }}-nextjs-build-cache-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
